
name: FoodExpress CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Check FoodExpress files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f index.html
          test -f sec.css
          test -f third.js
          test -f sc.jpeg

          echo "All required FoodExpress files exist."

      - name: Verify file references
        run: |
          grep -q "sec.css" index.html
          grep -q "third.js" index.html

          echo "CSS and JavaScript references found."
